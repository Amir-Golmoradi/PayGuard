name: Publish Docker Images

# This workflow is called after quality checks pass
on:
  workflow_call:

jobs:
  build-and-publish-images:
    name: Build Microservices Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Package (Skip Tests)
        # Tests are skipped because they already passed in the _quality workflow
        run: ./mvnw clean package -DskipTests

      - name: Install Maven Modules for Image Builds
        # Image builds run as separate Maven invocations and need reactor artifacts in the local repository.
        run: ./mvnw -DskipTests -Dpmd.skip=true -Dspotbugs.skip=true install

      - name: Verify Spring Boot plugin resolution
        run: |
          ./mvnw -version
          ./mvnw help:effective-pom -pl payguard-wallet-service \
            | grep -A8 -B2 spring-boot-maven-plugin

      # Spring Boot Buildpacks approach for highly optimized container images
      - name: Build Wallet Service Image
        run: >
          ./mvnw -pl payguard-wallet-service
          org.springframework.boot:spring-boot-maven-plugin:4.0.1:build-image
          -Dspring-boot.build-image.imageName=payguard/wallet-service:latest

      - name: Build Loan Service Image
        run: >
          ./mvnw -pl payguard-loan-service
          org.springframework.boot:spring-boot-maven-plugin:4.0.1:build-image
          -Dspring-boot.build-image.imageName=payguard/loan-service:latest

      - name: Build Collateral Service Image
        run: >
          ./mvnw -pl payguard-collateral-service
          org.springframework.boot:spring-boot-maven-plugin:4.0.1:build-image
          -Dspring-boot.build-image.imageName=payguard/collateral-service:latest
