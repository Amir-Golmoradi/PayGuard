name: Publish Docker Images

# This workflow is called after quality checks pass
on:
  workflow_call:

jobs:
  build-and-publish-images:
    name: Build Microservices Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Package (Skip Tests)
        # Tests are skipped because they already passed in the _quality workflow
        run: ./mvnw clean package -DskipTests

      # Spring Boot Buildpacks approach for highly optimized container images
      - name: Build Wallet Service Image
        run: ./mvnw -pl payguard-wallet-service spring-boot:build-image -Dspring-boot.build-image.imageName=payguard/wallet-service:latest

      - name: Build Loan Service Image
        run: ./mvnw -pl payguard-loan-service spring-boot:build-image -Dspring-boot.build-image.imageName=payguard/loan-service:latest

      - name: Build Collateral Service Image
        run: ./mvnw -pl payguard-collateral-service spring-boot:build-image -Dspring-boot.build-image.imageName=payguard/collateral-service:latest