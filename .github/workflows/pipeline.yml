name: PayGuard Main Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [ opened, reopened, synchronize ]

jobs:
  # 1. Always run quality checks on PRs and main branch pushes
  quality-check:
    uses: ./.github/workflows/_quality.yml

  # 2. Docker images are built only after a successful push to main.
  # Pull requests intentionally skip this job because they must not publish images.
  publish-docker:
    needs: quality-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_publish.yml
