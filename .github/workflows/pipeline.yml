name: PayGuard Main Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [ opened, reopened, synchronize ]

jobs:
  # 1. Always run quality checks on PRs and main branch pushes
  quality-check:
    uses: ./.github/workflows/_quality.yml

  # 2. Build container images on every PR and main push.
  # This job validates images; it does not publish to an external registry.
  publish-docker:
    needs: quality-check
    uses: ./.github/workflows/_publish.yml
